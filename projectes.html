<!DOCTYPE HTML>
<html>

<head>
	<title>Projectes | Eduard Benet</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css" />
	<noscript>
		<link rel="stylesheet" href="assets/css/noscript.css" />
	</noscript>
	<style>
		.projects {
			position: relative;
			z-index: 3;
			box-sizing: border-box;
			min-height: 100vh;
			max-width: 34rem;
			margin: 0 auto;
			padding: 3.5rem 2rem;
			display: flex;
			flex-direction: column;
		}

		.projects-back {
			align-self: flex-start;
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.2rem;
			border-bottom: 0;
			opacity: 0.6;
		}

		.projects-back:hover {
			opacity: 1;
		}

		.projects-intro {
			margin-top: auto;
			padding-top: 4rem;
		}

		.projects-intro .eyebrow {
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.3rem;
			opacity: 0.6;
			margin: 0 0 0.75rem 0;
		}

		.projects-intro h2 {
			margin-bottom: 1rem;
		}

		.projects-intro p {
			max-width: 30rem;
			opacity: 0.85;
		}

		.projects-list {
			list-style: none;
			padding: 0;
			margin: 1rem 0 auto 0;
			border-top: solid 1px rgba(255, 255, 255, 0.25);
		}

		.projects-list li {
			border-bottom: solid 1px rgba(255, 255, 255, 0.25);
		}

		.projects-list a {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			padding: 1.15rem 0;
			border-bottom: 0;
		}

		.projects-list a:before {
			-moz-osx-font-smoothing: grayscale;
			-webkit-font-smoothing: antialiased;
			font-family: 'Font Awesome 5 Brands';
			font-weight: 400;
			font-size: 1.2rem;
			margin-right: 1rem;
			opacity: 0.85;
		}

		.projects-list .name {
			flex-grow: 1;
			font-weight: 600;
		}

		.projects-list .meta {
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.15rem;
			opacity: 0.6;
			white-space: nowrap;
		}

		.projects-list a:hover .meta {
			opacity: 1;
		}

		@media screen and (max-width: 480px) {
			.projects {
				padding: 2.5rem 1.25rem;
			}
		}
	</style>
</head>

<body>

	<div class="projects">

		<a class="projects-back" href="index.html">&larr; Inici</a>

		<div class="projects-intro">
			<p class="eyebrow">Projectes</p>
			<h2 class="major">Repositoris seleccionats</h2>
			<p>Estic preparant una selecció dels meus projectes. Mentrestant, els pots consultar directament al perfil de GitHub.</p>
		</div>

		<ul class="projects-list">
			<li>
				<a href="https://github.com/EduardBenet" class="fa-github">
					<span class="name">github.com/EduardBenet</span>
					<span class="meta">Tots els repositoris &rarr;</span>
				</a>
			</li>
		</ul>

	</div>

	<!-- BG -->
	<div id="bg"></div>

</body>

</html>
